name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, please use [private reporting](https://github.com/lanyado/notion-listen/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did (for example, the comment you left), what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `notion-listen doctor "<page-url>"`
      description: It never prints your tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `~/.local/state/notion-listen/channel.log` and `router.log`.
      render: text
