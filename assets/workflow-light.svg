<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="The usual way: copy text from your doc into one giant chat and paste it back, with the doc locked while AI edits it. With notion-listen: each comment gets its own agent, running in parallel with your code and tools.">
