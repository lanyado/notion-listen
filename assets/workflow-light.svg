    <text x="818" y="207" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#111827">📊  Chart</text><rect x="552" y="252" width="150" height="8" rx="4" fill="#D1D5DB" opacity="1"/><rect x="550" y="264" width="140" height="12" rx="3" fill="#22C55E" opacity="0.3"/><rect x="552" y="266" width="136" height="8" rx="4" fill="#D1D5DB" opacity="1"/><rect x="552" y="282" width="96" height="8" rx="4" fill="#D1D5DB" opacity="1"/>
    <circle cx="716" cy="270" r="10" fill="#22C55E"/><text x="716" y="274.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
    <path d="M727 270 L 778 270" stroke="#22C55E" stroke-width="2.4" stroke-dasharray="6 6" style="animation:flow 1.2s linear infinite"/>
