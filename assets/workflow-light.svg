    <circle cx="716" cy="202" r="10" fill="#06B6D4"/><text x="716" y="206.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">2</text>
