  <style>@keyframes flow{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}</style>
  <rect x="0" y="0" width="470" height="420" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="26" y="44" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#111827">😩 The usual way</text>
  <rect x="26" y="76" width="150" height="200" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="42" y="104" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">📄 Your doc</text>
  <rect x="42" y="122" width="110" height="8" rx="4" fill="#D1D5DB" opacity="1"/><rect x="42" y="138" width="90" height="8" rx="4" fill="#D1D5DB" opacity="1"/><rect x="42" y="154" width="116" height="8" rx="4" fill="#D1D5DB" opacity="1"/><rect x="42" y="170" width="70" height="8" rx="4" fill="#D1D5DB" opacity="1"/>
  <rect x="38" y="200" width="126" height="56" rx="10" fill="#FEE2E2"/>
  <text x="101" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#B91C1C">🔒 Locked</text>
  <text x="101" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">while AI edits</text>
  <rect x="288" y="76" width="156" height="254" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
