    <text x="389.3" y="144.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.55">fix intro</text><rect x="300" y="174" width="78.8" height="28" rx="14" fill="#F3F4F6" opacity="0.63"/>
    <text x="339.4" y="192.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#111827" opacity="0.7000000000000001">a chart?</text><rect x="353.2" y="222" width="78.8" height="28" rx="14" fill="#6366F1" opacity="0.81"/>
    <text x="392.59999999999997" y="240.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8500000000000001">typo p.3</text><rect x="300" y="270" width="105.19999999999999" height="28" rx="14" fill="#F3F4F6" opacity="0.99"/>
    <text x="352.6" y="288.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#111827" opacity="1">paste again?</text>
  <path d="M178 130 C 220 100, 250 100, 284 130" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
