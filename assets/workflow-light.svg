    <circle cx="716" cy="134" r="10" fill="#F97316"/><text x="716" y="138.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">1</text>
